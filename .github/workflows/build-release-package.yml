name: Build release package

on:
  push:
    branches: [main]
    paths:
      - 'belabox/**'
      - 'docs/**'
      - 'integration/**'
      - 'receiver/**'
      - 'relay/**'
      - 'scripts/**'
      - 'streamerbot/**'
      - 'wiki/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/build-release-package.yml'

permissions:
  contents: write

concurrency:
  group: cometen-irl-system-release-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Streamer.bot import and v1.0 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json
          import uuid
          import zipfile

          version = '1.0.0'
          release_label = '1.0'
          group = 'IRL BelaBox Alerts'
          package_root = f'CometenIRLSystem-v{release_label}'
          release_dir = Path('release')
          release_dir.mkdir(parents=True, exist_ok=True)

          def stable_id(name: str) -> str:
              return str(uuid.uuid5(uuid.NAMESPACE_URL, f'https://github.com/la1ona/CometenIRLSystem/{name}'))

          def wrapper_source(target: str, arguments=None) -> bytes:
              arguments = arguments or []
              lines = [
                  'using System;',
                  '',
                  'public class CPHInline',
                  '{',
                  '    public bool Execute()',
                  '    {'
              ]
              for key, value in arguments:
                  if isinstance(value, int):
                      rendered = str(value)
                  elif isinstance(value, bool):
                      rendered = 'true' if value else 'false'
                  else:
                      rendered = json.dumps(str(value), ensure_ascii=False)
                  lines.append(f'        CPH.SetArgument({json.dumps(key)}, {rendered});')
              lines.append(f'        return CPH.RunAction({json.dumps(target)}, true);')
              lines.extend(['    }', '}', ''])
              return '\n'.join(lines).encode('utf-8')

          def file_source(path: str) -> bytes:
              source_path = Path(path)
              if not source_path.is_file():
                  raise RuntimeError(f'Missing Streamer.bot source: {path}')
              return source_path.read_bytes()

          # Keep this order aligned with the production IRL BelaBox Alerts group.
          action_specs = [
              ('Cometen IRL Globals', wrapper_source('CometenIRL_Setup')),
              ('Cometen IRL Notifications - Send', file_source('streamerbot/CometenIRL_Send.cs')),
              ('Cometen IRL Notifications - Test', wrapper_source(
                  'Cometen IRL Notifications - Send', [('eventType', 'test')]
              )),
              ('CometenIRL_AdminControl', file_source('streamerbot/CometenIRL_AdminControl.cs')),
              ('CometenIRL_BrowserAudioControl', file_source('streamerbot/CometenIRL_BrowserAudioControl.cs')),
              ('CometenIRL_EndAutoStop', file_source('streamerbot/CometenIRL_EndAutoStop.cs')),
              ('CometenIRL_RemoteControl', file_source('streamerbot/CometenIRL_RemoteControl.cs')),
              ('CometenIRL_Setup', file_source('streamerbot/CometenIRL_Setup.cs')),
              ('IRL - Alert Test', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'alert_test')]
              )),
              ('IRL - Status', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'status')]
              )),
              ('IRL - Volume 100', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'volume_set'), ('controlValue', 100)]
              )),
              ('IRL - Volume 25', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'volume_set'), ('controlValue', 25)]
              )),
              ('IRL - Volume 50', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'volume_set'), ('controlValue', 50)]
              )),
              ('IRL - Volume 75', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'volume_set'), ('controlValue', 75)]
              )),
              ('IRL - Volume mute', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'mute')]
              )),
              ('IRL - Volume unmute', wrapper_source(
                  'CometenIRL_RemoteControl', [('controlAction', 'unmute')]
              )),
              ('IRLAlertsController', file_source('streamerbot/IRLAlertsController.cs')),
          ]

          actions = []
          for action_name, source_bytes in action_specs:
              actions.append({
                  'id': stable_id(f'action/{action_name}'),
                  'queue': '00000000-0000-0000-0000-000000000000',
                  'enabled': True,
                  'excludeFromHistory': False,
                  'excludeFromPending': False,
                  'name': action_name,
                  'group': group,
                  'alwaysRun': False,
                  'randomAction': False,
                  'concurrent': False,
                  'triggers': [],
                  'subActions': [
                      {
                          'name': None,
                          'description': None,
                          'references': [],
                          'byteCode': base64.b64encode(source_bytes).decode('ascii'),
                          'precompile': False,
                          'delayStart': False,
                          'saveResultToVariable': False,
                          'saveToVariable': None,
                          'id': stable_id(f'csharp/{action_name}'),
                          'weight': 0.0,
                          'type': 99999,
                          'parentId': None,
                          'enabled': True,
                          'index': 0
                      }
                  ],
                  'collapsedGroups': []
              })

          export = {
              'meta': {
                  'name': f'Cometen IRL System v{release_label}',
                  'author': 'Cometen',
                  'version': version,
                  'description': (
                      'Ready-to-import 17-action Streamer.bot package for Cometen IRL System. '
                      'Includes core actions plus production-compatible test, status, volume, mute '
                      'and globals wrapper actions. Run CometenIRL_Setup once after import.'
                  )
              },
              'data': {
                  'actions': actions,
                  'queues': [],
                  'commands': [],
                  'websocketServers': [],
                  'websocketClients': [],
                  'timers': []
              },
              'version': 24,
              'exportedFrom': '1.0.7',
              'minimumVersion': '1.0.0-alpha.1'
          }

          json_bytes = json.dumps(export, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          encoded = base64.b64encode(b'SBAE' + gzip.compress(json_bytes, mtime=0)).decode('ascii')

          import_name = f'CometenIRLSystem_{version}.sb'
          import_path = release_dir / import_name
          import_path.write_text(encoded, encoding='utf-8', newline='')

          # Validate generated Streamer.bot import before packaging.
          decoded = base64.b64decode(import_path.read_text(encoding='utf-8'))
          assert decoded[:4] == b'SBAE'
          verified = json.loads(gzip.decompress(decoded[4:]))
          imported_actions = verified['data']['actions']
          expected_names = [name for name, _ in action_specs]
          assert len(imported_actions) == 17
          assert [a['name'] for a in imported_actions] == expected_names
          assert all(a['group'] == group for a in imported_actions)
          assert all(len(a['subActions']) == 1 for a in imported_actions)
          assert all(a['subActions'][0]['type'] == 99999 for a in imported_actions)
          assert verified['data']['commands'] == []

          out = release_dir / f'CometenIRLSystem-v{release_label}.zip'

          files = [
              (import_path, import_name),
              (Path('README.md'), 'README.md'),
              (Path('LICENSE'), 'LICENSE'),
          ]

          included_dirs = [
              'belabox',
              'docs',
              'integration',
              'receiver',
              'relay',
              'scripts',
              'streamerbot',
              'wiki',
          ]

          excluded_paths = {
              'relay/config.php',
              'receiver/config.json',
          }
          excluded_names = {
              '.env',
              '.env.local',
              '.DS_Store',
          }

          for directory in included_dirs:
              base = Path(directory)
              if not base.exists():
                  continue
              for source in sorted(base.rglob('*')):
                  if not source.is_file():
                      continue
                  rel = source.as_posix()
                  if rel in excluded_paths:
                      continue
                  if source.name in excluded_names:
                      continue
                  if '__pycache__' in source.parts:
                      continue
                  if source.suffix in {'.pyc', '.log'}:
                      continue
                  files.append((source, rel))

          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as archive:
              for source, name in files:
                  archive.write(source, f'{package_root}/{name}')

          # Validate package contents and secret exclusions.
          with zipfile.ZipFile(out, 'r') as archive:
              names = archive.namelist()
              assert f'{package_root}/{import_name}' in names
              assert f'{package_root}/streamerbot/CometenIRL_Setup.cs' in names
              assert f'{package_root}/receiver/receiver.py' in names
              assert f'{package_root}/README.md' in names
              assert not any(name.endswith('/relay/config.php') for name in names)
              assert not any(name.endswith('/receiver/config.json') for name in names)

          print(f'Built import: {import_path} ({import_path.stat().st_size} bytes)')
          print(f'Built package: {out} ({out.stat().st_size} bytes)')
          print(f'Imported Streamer.bot actions: {len(action_specs)}')
          print(f'Package files: {len(files)}')
          PY

      - name: Commit refreshed import and package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/CometenIRLSystem_1.0.0.sb release/CometenIRLSystem-v1.0.zip
          if git diff --cached --quiet; then
            echo "Release import and package are already up to date."
            exit 0
          fi
          git commit -m "Build full 17-action Cometen IRL System v1.0 package"
          git push
