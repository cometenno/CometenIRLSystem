name: One-shot clean front image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-front-image.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified JPEG
        shell: bash
        run: |
          base64 -d .tmp/board-clean.b64 > docs/images/belabox-board-overview-clean.jpg
          echo '9ae1a755ac38a5d016960cbd02a00bce775dfc1855d0b79ab5698080f5672964  docs/images/belabox-board-overview-clean.jpg' | sha256sum -c -
          file docs/images/belabox-board-overview-clean.jpg | grep -q 'JPEG image data'

      - name: Point README and Wiki to clean image
        shell: bash
        run: |
          sed -i 's#docs/images/belabox-board-overview.webp#docs/images/belabox-board-overview-clean.jpg#g' README.md
          sed -i 's#docs/images/belabox-board-overview.webp#docs/images/belabox-board-overview-clean.jpg#g' wiki/Home.md
          sed -i 's#https://raw.githubusercontent.com/la1ona/CometenIRLSystem/main/docs/images/belabox-board-overview.webp#https://raw.githubusercontent.com/la1ona/CometenIRLSystem/main/docs/images/belabox-board-overview-clean.jpg#g' wiki/Home.md

      - name: Remove staging files and this workflow
        shell: bash
        run: |
          rm -rf .tmp
          rm -f .github/workflows/one-shot-clean-front-image.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace corrupted front image with verified JPEG'
          git push
