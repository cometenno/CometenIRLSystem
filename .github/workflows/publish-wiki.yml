name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish wiki source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          WIKI_DIR="${RUNNER_TEMP}/cometen-irl-system-wiki"

          git clone "${WIKI_URL}" "${WIKI_DIR}"

          find "${WIKI_DIR}" -maxdepth 1 -type f -name '*.md' -delete
          cp wiki/*.md "${WIKI_DIR}/"

          cd "${WIKI_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "Sync Cometen IRL System Wiki"
          WIKI_BRANCH="$(git branch --show-current)"
          git push origin "HEAD:${WIKI_BRANCH}"
